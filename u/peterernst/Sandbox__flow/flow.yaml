summary: Sandbox
description: ''
value:
  modules:
    - id: m
      summary: Image Forge
      value:
        type: aiagent
        input_transforms:
          enabled_tools:
            type: static
            value: null
          max_completion_tokens:
            type: static
            value: null
          max_iterations:
            type: static
            value: 10
          memory:
            type: static
            value:
              kind: compaction
          output_schema:
            type: static
            value: null
          output_type:
            type: static
            value: image
          provider:
            type: static
            value:
              kind: openrouter
              model: google/gemini-3.1-flash-image
              resource: $res:u/peterernst/openrouter_api_key
          streaming:
            type: static
            value: true
          system_prompt:
            type: static
            value: "You generate and edit one single image across a multi-turn
              conversation.\r

              Turn 1: create the image described by the user. \r

              Every later turn: apply only the change the user asks for to the
              image attached in the message,\r

              and keep every other element unchanged. Keep subject, composition
              and style consistent unless the user changes them.\r

              Always return an image."
          temperature:
            type: static
            value: null
          user_attachments:
            type: javascript
            expr: flow_input.files
          user_message:
            type: javascript
            expr: flow_input.user_message
        tools: []
  chat_input_enabled: true
  groups: []
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - user_message
    - files
  properties:
    files:
      type: array
      description: Images or PDFs for the agent to read
      items:
        type: object
        resourceType: s3object
    user_message:
      type: string
      description: Message from user
      default: ''
  required:
    - user_message
