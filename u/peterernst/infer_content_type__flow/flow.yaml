summary: Infer content type
description: Classifies Markdown content by choosing a best-fit content type.
  Provide Markdown text as `content`; the selected type is returned as
  `content_type.choice` with `content_type.confidence` . Additionally the
  `probabilities` array contains the probabilities of all available choices.
value:
  modules:
    - id: types
      summary: Read type definitions
      value:
        type: script
        input_transforms:
          extension:
            type: static
            value: md
          filename:
            type: static
            value: Note Type Definitions
          location:
            type: static
            value: Vault Backoffice
          vault:
            type: static
            value: WetHat Lab
        is_trigger: false
        path: f/lib/load_vault_file
    - id: defs
      summary: Extract type definitions
      value:
        type: script
        input_transforms:
          markdown:
            type: javascript
            expr: results.types.data
        is_trigger: false
        path: f/lib/extract_markdown_table_data
    - id: ask
      summary: Prepare questions
      value:
        type: rawscript
        content: '!inline prepare_questions.ts'
        input_transforms:
          types:
            type: javascript
            expr: results.defs[0]
        lock: '!inline prepare_questions.lock'
        language: bun
    - id: choice
      summary: ''
      value:
        type: aidecision
        input_transforms:
          provider:
            type: static
            value:
              kind: openai
              model: gpt-6-luna
              resource: $res:u/peterernst/openai_api_key
          questions:
            type: javascript
            value:
              intent:
                type: choice
                criteria:
                  action: Something to be done
                  other: Anything else
                  question: An answer to a question
                instructions: What does the message ask for?
            expr: results.ask
          state:
            type: javascript
            value: null
            expr: flow_input.content
      continue_on_error: false
    - id: shape
      summary: Shape response
      value:
        type: rawscript
        content: '!inline shape_response.ts'
        input_transforms:
          output:
            type: javascript
            expr: results.choice.output
        lock: '!inline shape_response.lock'
        language: bun
  groups: []
schema:
  order:
    - content
  properties:
    content:
      type: string
      description: Markdown content for type determination
      default: ''
      nullable: false
      placeholder: content ...
      title: Content
  required:
    - content
  x-windmill-dyn-select-code: |-
    // you can use filterText to filter the results from the backend
    // you can refer to other args directly as parameters (e.g. foobar: string)
    export function vault(filterText: string) {
    	return [
    		{ label: 'Foo', value: 'foo' },
    		{ label: 'Bar', value: 'bar' }
    	];
    }
  x-windmill-dyn-select-lang: bun
tag: bun
