summary: Scrape a web article as Markdown
description: ''
value:
  modules:
    - id: scrape
      summary: Scrape web content browserless -> Redis
      value:
        type: script
        input_transforms:
          url:
            type: javascript
            expr: flow_input.url
        is_trigger: false
        path: f/lib/scrape_web_content_browserless
    - id: extract
      summary: Extract main article as Markdown
      value:
        type: script
        input_transforms:
          scraped:
            type: javascript
            expr: results.scrape
        is_trigger: false
        path: f/lib/extract_markdown_article
    - id: finalize_extraction
      summary: Finalize
      value:
        type: rawscript
        content: '!inline finalize.ts'
        input_transforms:
          md_article:
            type: javascript
            expr: results.extract
        lock: '!inline finalize.lock'
        language: bun
  groups: []
schema:
  order:
    - url
  properties:
    url:
      type: string
      description: Link to web page
      default: ''
      placeholder: http(s)://...
      title: Url
  required: []
tag: bun
