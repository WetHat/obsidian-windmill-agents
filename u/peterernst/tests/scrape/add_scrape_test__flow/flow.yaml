summary: Add scrape test
description: ''
value:
  modules:
    - id: scrape
      summary: Scrape web content browserless -> Redis
      value:
        type: script
        input_transforms:
          url:
            type: javascript
            expr: flow_input.url
        is_trigger: false
        path: f/lib/scrape_web_content_browserless
    - id: add
      summary: Add Scrape Test Record
      value:
        type: rawscript
        content: '!inline add_scrape_test_record.ts'
        input_transforms:
          scraped:
            type: javascript
            expr: results.scrape
        assets:
          - access_type: w
            columns:
              body: w
              head: w
              url: w
            kind: datatable
            path: test/web_scrape_test
        lock: '!inline add_scrape_test_record.lock'
        language: bun
  groups: []
schema:
  order:
    - url
  properties:
    url:
      type: string
      description: Hyperlink to the web page to add
      default: ''
      placeholder: http(s)://...
      title: Url
  required: []
tag: bun
