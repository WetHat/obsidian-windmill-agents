summary: Download RSS feed and add to tests
description: ''
value:
  modules:
    - id: a
      summary: Download RSS/Atom feed
      value:
        type: script
        input_transforms:
          feed_url:
            type: javascript
            expr: flow_input.url
          short_content:
            type: javascript
            expr: flow_input.short_content
        is_trigger: false
        path: u/peterernst/tests/rss/add_test_feed/download_feed
  groups: []
  notes: []
schema:
  order:
    - url
    - short_content
  properties:
    short_content:
      type: boolean
      description: Feed Items have short content
      default: false
      title: Short Content
    url:
      type: string
      description: Url of the RSS/Atom feed
      default: ''
      nullable: false
      placeholder: http(s)://....
      title: Url
  required:
    - url
