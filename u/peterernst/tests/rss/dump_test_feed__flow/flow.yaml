summary: Dump test feed items to Inbox
description: ''
value:
  modules:
    - id: fetch
      summary: Fetch items from a test feed
      value:
        type: script
        input_transforms:
          feed_id:
            type: javascript
            expr: flow_input.feed_id
          item_indices:
            type: javascript
            expr: flow_input.items
        is_trigger: false
        path: u/peterernst/tests/rss/fetch_test_feed_items
    - id: a
      summary: For each item
      value:
        type: forloopflow
        modules:
          - id: dehydrate
            summary: Dehydrate feed item
            value:
              type: script
              input_transforms:
                handle:
                  type: javascript
                  expr: flow_input.iter.value
              is_trigger: false
              path: u/peterernst/rss_feeds_triage/dehydrate_feed_item
          - id: assemble
            summary: Assemble test feed item dump
            value:
              type: script
              input_transforms:
                item:
                  type: javascript
                  expr: results.dehydrate
              is_trigger: false
              path: u/peterernst/tests/rss/assemble_test_feed_item_dump
          - id: dump
            summary: Write item dump to vault
            value:
              type: script
              input_transforms:
                content:
                  type: javascript
                  expr: results.assemble.content
                extension:
                  type: static
                  value: md
                filename:
                  type: javascript
                  expr: results.assemble.filename
                location:
                  type: static
                  value: Inbox
                vault:
                  type: static
                  value: WetHat Lab
              is_trigger: false
              path: f/lib/write_to_vault
        iterator:
          type: javascript
          expr: results.fetch.item_handles
        parallel: false
        skip_failures: true
        squash: true
  groups: []
  notes:
    - id: note-i16ci9jfgcpomsy5p09u
      type: free
      color: green
      locked: false
      position:
        x: 165.52235671588497
        y: 2.8357074842275978
      size:
        height: 200
        width: 300
      text: >-
        ### Purpose

        Fetches selected items from a test RSS feed in the `test_feeds` table,
        converts each item into a dehydrated representation, assembles a
        Markdown dump, and writes each dump to the WetHat Lab vault’s Inbox.
        Items are processed sequentially, and individual item failures are
        skipped.
schema:
  order:
    - feed_id
    - items
  prompt_for_ai: ''
  properties:
    feed_id:
      type: integer
      description: Id of the feed record in the `test_feeds` table
      nullable: false
      title: Feed ID
    items:
      type: array
      description: Indices of the items to dump
      default: []
      items:
        type: string
      title: Item Indices
  required:
    - feed_id
tag: bun
