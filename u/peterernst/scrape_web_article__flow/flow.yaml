summary: Scrape web-article
description: Scrape the content of a web page using the Browserless service and
  return its main article as Markdown
value:
  modules:
    - id: request
      summary: Build Browserless request
      value:
        type: script
        input_transforms:
          url:
            type: javascript
            expr: flow_input.url
        is_trigger: false
        path: u/peterernst/bld_browserless_request
    - id: extract
      summary: Extract article
      value:
        type: script
        input_transforms:
          body:
            type: javascript
            expr: results.request.body
          headers:
            type: javascript
            expr: results.request.headers
          url:
            type: javascript
            expr: flow_input.url
        is_trigger: false
        path: u/peterernst/scrape_web_article/extract_article
  groups: []
schema:
  order:
    - url
  properties:
    url:
      type: string
      description: url of web page to scrape
      default: ''
      title: Url
  required: []
