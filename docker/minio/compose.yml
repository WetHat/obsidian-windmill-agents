services:
  minio:
    image: coollabsio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: windmill
      MINIO_ROOT_PASSWORD: wm937412

    volumes:
      - minio_data:/data

    networks:
      - wmnet

    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI

volumes:
  minio_data: null

networks:
  wmnet:
    external: true